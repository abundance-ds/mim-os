name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libglib2.0-dev

      - run: npm ci
      - run: npm run build
      - run: npm test -- --silent

      - name: Verify generated documentation
        run: |
          npm run docs:gen
          git diff --exit-code -- manual
          npm run docs:lint
